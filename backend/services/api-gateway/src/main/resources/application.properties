
# ==========================================
# RESTOFY - API GATEWAY
# ==========================================

# APPLICATION
spring.application.name=api-gateway
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ==========================================
# API GATEWAY ROUTES
# ==========================================

# AUTH
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth,/api/v1/auth/**

# ORDER (orders and the guest cart, both owned by the order service)
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${ORDER_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/orders,/api/v1/orders/**,/api/v1/carts,/api/v1/carts/**

