# ==========================================
# RESTOFY - qr-service
# ==========================================

# APPLICATION
spring.application.name=qr-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_QR_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject mass-assignment fields such as restaurantId, role and operationalStatus.
spring.jackson.deserialization.fail-on-unknown-properties=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Required in every runtime environment; never use a fallback encryption key.
qr.payload.encryption-key=${QR_PAYLOAD_ENCRYPTION_KEY}

# Empty disables image rendering with 503; configured URLs are validated at startup.
qr.public-entry-url=${QR_PUBLIC_ENTRY_URL:}

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
