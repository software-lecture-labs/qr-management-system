# ==========================================
# RESTOFY - waiter-service
# ==========================================

# APPLICATION
spring.application.name=waiter-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_WAITER_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# SERVICE-TO-SERVICE HTTP
restofy.rest-client.connect-timeout-ms=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}
restofy.rest-client.read-timeout-ms=${REST_CLIENT_READ_TIMEOUT_MS:5000}
restofy.services.qr-url=${QR_SERVICE_URL}
restofy.services.order-url=${ORDER_SERVICE_URL}
restofy.services.notification-url=${NOTIFICATION_SERVICE_URL}

# NOTIFICATION SYNC (durable local queue + internal HTTP; defaults are policy, not environment variables)
restofy.notification.dispatcher.enabled=true
restofy.notification.dispatcher.interval-ms=2000
restofy.notification.dispatcher.batch-size=20
restofy.notification.dispatcher.lease-seconds=120
restofy.notification.dispatcher.max-attempts=24
restofy.notification.dispatcher.initial-backoff-seconds=5
restofy.notification.dispatcher.max-backoff-seconds=300

# TABLE COMMANDS (close / cleaned): background check of commands without a final answer of QR; defaults are policy, not environment variables
restofy.table-commands.reconciler.enabled=true
restofy.table-commands.reconciler.interval-ms=5000
restofy.table-commands.reconciler.batch-size=20
restofy.table-commands.reconciler.min-age-seconds=20
restofy.table-commands.reconciler.max-age-hours=48

# GUEST CALLS: new calls one guest session may raise within the sliding window (counted in the database; defaults are policy, not environment variables)
restofy.calls.guest-rate-limit.max-new-calls=6
restofy.calls.guest-rate-limit.window-seconds=600

# Request bodies: reject unknown fields so a client cannot believe a body field (e.g. restaurantId) was honoured.
spring.jackson.deserialization.fail-on-unknown-properties=true
