# Kitchen tests only (merged with the shared backend/test-support/application-test.properties; never used by the application).
# Every cached Spring test context owns a connection pool, and the test PostgreSQL allows 100 connections in total. The suite
# has about twenty differently configured contexts (the restart tests add more), so each pool is kept small and its idle
# connections are returned quickly. Four is enough: the tests that open a second, rival transaction need two connections.
# This changes no test and no production setting.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
